name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # This runs 'vite build' via your package.json script
    - name: Build project
      run: npm run build
